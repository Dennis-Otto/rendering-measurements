            https://github.com/cli/cli/issues/297#issuecomment-657164702
            https://github.com/cli/cli/issues/9569#issuecomment-2365269383
          # Hashes of the REST readings without a token, made by the same script on
          # 2026-11-22; used only where the runner's own call without a token
          # is not answered.
          EXPECTED: |
            {
             "https://github.com/Dennis-Otto/repo-pager/issues/41": {
              "html": "3b9ac79dc1302ad5",
              "text": "d9ebb9587563970a"
             },
             "https://github.com/Dennis-Otto/repo-blueprint/issues/212#issuecomment-6346747072": {
