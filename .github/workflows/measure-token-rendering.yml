              "text": "afb7ce3a92c2864c"
             },
             "https://github.com/Dennis-Otto/issue-assistant/issues/45#issuecomment-6140191677": {
              "html": "bfd1980d91422a32",
              "text": "ddc51555af51fbe2"
             },
