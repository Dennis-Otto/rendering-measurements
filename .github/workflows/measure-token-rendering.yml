              "html": "067b6340bc813a8b",
              "text": "0b392a3235059a60"
             },
             "https://github.com/cli/cli/issues/5924#issuecomment-1335963084": {
              "html": "fc60b86e94943ef7",
              "text": "c769b401b36e177d"
             },
             "https://github.com/cli/cli/issues/297#issuecomment-657164702": {
              "html": "e837ddefb0f576fe",
              "text": "758820b3ae2302f1"
             },
             "https://github.com/cli/cli/issues/9569#issuecomment-2365269383": {
