# One-off measurement for a design question of the issue assistant: what the
# token of a workflow gets when it reads rendered texts, against a call without
# a token. Started once by hand, then removed again. It prints no HTML and no
# text of a link: only hashes, lengths and counts, and a hash and length only
# where a reading equals the one without a token.
name: Measure token rendering
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read each text with the job's token and without a token
        env:
          MEASURE_TOKEN: ${{ github.token }}
          URLS: |
            https://github.com/Dennis-Otto/repo-pager/issues/41
            https://github.com/Dennis-Otto/repo-blueprint/issues/212#issuecomment-6346747072
