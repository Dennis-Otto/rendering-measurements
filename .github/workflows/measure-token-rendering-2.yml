# measurement: ZqWorkflow filler. One-off; prints only counts, yes or no, lengths and salted hashes.
name: measurement ZqTokenRendering
on:
  workflow_dispatch:
    inputs:
      label:
        description: ZqLabel
        required: true
        default: run
permissions:
  contents: read
  issues: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ZqRead
        env:
          MEASURE_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.label }}
          MORE: "1"
          ISSUES: "105 106 107"
          CFG: '{"salt": "22b0458b8629142fca80be5fd328a921", "markers": [{"label": "title1", "len": 27, "hash": "f59749ba0835f84ef21a08c97109aa75"}, {"label": "title2", "len": 30, "hash": "76f7a2c977a7e9eac19e5514445b863a"}, {"label": "title3", "len": 32, "hash": "f7187e898cc13d008ad59589ad4df96b"}, {"label": "body_priv", "len": 26, "hash": "bd1b055926e779e7a9cf2c1984c23e20"}, {"label": "newname", "len": 23, "hash": "05efcba3caa13a887bb87c22bcffbf6f"}, {"label": "newname2", "len": 26, "hash": "8300d7eaadf26f25c5684f294f684582"}, {"label": "newname3", "len": 28, "hash": "9ea04b0a3ea303cd78030230fdc40446"}], "ids": [{"label": "private_issue_1", "h10": 663}, {"label": "private_issue_2", "h10": 261}, {"label": "private_issue_3", "h10": 890}]}'
        shell: python3 {0}
        run: |
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          TOKEN = os.environ.get("MEASURE_TOKEN") or None
          SAVE = os.environ.get("SAVE_DIR") or None  # local runs only: keeps the full readings on disk
          LABEL = os.environ.get("LABEL", "run")
          CFG = json.loads(os.environ["CFG"])
          SALT = CFG["salt"]
          REPO = "Dennis-Otto/rendering-measurements"
          OLD = "rendering-measurements-private"
          TARGETS = [int(n) for n in os.environ["ISSUES"].split()]
          CONTROL = 2


          def get(url, token=None, accept="application/vnd.github.full+json", data=None):
              headers = {"Accept": accept, "User-Agent": "rendering-measurement"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              request = urllib.request.Request(url, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", "replace")
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  return 0, type(error).__name__


          def norm(html):
              html = re.sub(r'data-(run-id|identity)="[^"]*"', r'data-\1=""', html)
              return re.sub(r"jwt=[^\"&]+", "jwt=X", html)


          def salted(text):
              return hashlib.sha256((SALT + text).encode()).hexdigest()[:16]


          def holds(text, marker):
              """Whether the lowercased text holds the marker, compared by salted hash only."""
              text, n = text.lower(), marker["len"]
              want = marker["hash"]
              for i in range(len(text) - n + 1):
                  if hashlib.sha256((SALT + text[i:i + n]).encode()).hexdigest()[:32] == want:
                      return True
              return False


          def h10(number):
              return int(hashlib.sha256((SALT + "id:" + number).encode()).hexdigest(), 16) & 1023


          def ids_in(text):
              numbers = set(re.findall(r"\d{6,}", text))
              return {i["label"]: any(h10(n) == i["h10"] for n in numbers) for i in CFG["ids"]}


          class Doc(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth, self.text, self.outside, self.attrs, self.links = 0, [], [], [], []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if value:
                          self.attrs.append(value)
                  if tag == "a":
                      self.depth += 1
                      a = dict(attrs)
                      self.current = {"class": (a.get("class") or "").split(), "href": a.get("href") or "",
                                      "names": sorted(k for k, _ in attrs if k.startswith("data-")),
                                      "data_id": a.get("data-id"), "text": ""}
                      self.links.append(self.current)

              def handle_endtag(self, tag):
                  if tag == "a" and self.depth:
                      self.depth -= 1
                      if not self.depth:
                          self.current = None

              def handle_data(self, data):
                  self.text.append(data)
                  if self.depth and self.current is not None:
                      self.current["text"] += data
                  if not self.depth:
                      self.outside.append(data)


          def markers(text):
              return {m["label"]: holds(text, m) for m in CFG["markers"]}


          def html_facts(html, ref, public_ids):
              if not isinstance(html, str):
                  return {"state": "absent"}
              n = norm(html)
              d = Doc()
              d.feed(n)
              d.close()
              text, outside, attrs = " ".join(d.text), " ".join(d.outside), " ".join(d.attrs)
              issue_links = [a for a in d.links if "issue-link" in a["class"]]
              to_public = [a for a in issue_links if f"/{REPO}/issues/" in a["href"]]
              data_ids = [a["data_id"] for a in issue_links if a["data_id"]]
              return {
                  "length": len(html), "hash": salted(n),
                  "a": len(d.links), "issue_link": len(issue_links), "issue_link_to_public_repo": len(to_public),
                  "issue_link_other": len(issue_links) - len(to_public),
                  "issue_link_data_attr_names": sorted({x for a in issue_links if a not in to_public for x in a["names"]}),
                  "data_id_values": len(data_ids), "data_id_equal_public_issue": sum(v in public_ids for v in data_ids),
                  "ref_plain_outside_links": bool(ref) and ref in outside,
                  "ref_as_plain_autolink": bool(ref) and any(a["text"].strip() == ref and not a["class"] for a in d.links),
                  "old_name_in_text": text.lower().count(OLD), "old_name_in_attrs": attrs.lower().count(OLD),
                  "markers_in_text": markers(text), "markers_in_attrs": markers(attrs),
                  "private_id_in_text": ids_in(text), "private_id_in_attrs": ids_in(attrs),
              }


          def text_facts(text, ref):
              if not isinstance(text, str):
                  return {"state": "absent"}
              return {"length": len(text), "hash": salted(text), "ref_plain": bool(ref) and ref in text,
                      "old_name": text.lower().count(OLD), "markers": markers(text), "private_id": ids_in(text)}


          def rest(number, token):
              status, body = get(f"https://api.github.com/repos/{REPO}/issues/{number}", token)
              try:
                  data = json.loads(body) if status == 200 else None
              except ValueError:
                  data = None
              return status, data


          Q_NODE = "query($id: ID!) { node(id: $id) { ... on Issue { bodyHTML bodyText } } }"
          Q_NODES = "query($ids: [ID!]!) { nodes(ids: $ids) { ... on Issue { number bodyHTML bodyText } } }"
          Q_LIST = ("query { repository(owner: \"Dennis-Otto\", name: \"rendering-measurements\") "
                    "{ issues(last: 10, orderBy: {field: CREATED_AT, direction: ASC}) { nodes { number bodyHTML bodyText } } } }")
          Q_SEARCH = ("query { search(type: ISSUE, first: 10, query: \"repo:Dennis-Otto/rendering-measurements ZqFillerDelta\") "
                      "{ nodes { ... on Issue { number bodyHTML bodyText } } } }")


          def graphql_many(query, variables, token):
              if not token:
                  return "no token", {}
              data = json.dumps({"query": query, "variables": variables}).encode()
              status, body = get("https://api.github.com/graphql", token, "application/json", data)
              try:
                  answer = json.loads(body)
              except ValueError:
                  return f"status {status}, no JSON", {}
              if answer.get("errors"):
                  return "errors: " + ", ".join(sorted({str(e.get("type", "error")) for e in answer["errors"]})), {}
              d = answer.get("data") or {}
              nodes = d.get("nodes") or ((d.get("repository") or {}).get("issues") or {}).get("nodes") or (d.get("search") or {}).get("nodes") or []
              return f"status {status}", {n["number"]: n for n in nodes if isinstance(n, dict) and "number" in n}


          Q_REPO = ("query($o: String!, $n: String!, $i: Int!) { repository(owner: $o, name: $n) "
                    "{ issue(number: $i) { bodyHTML bodyText } } }")


          def graphql(query, variables, token):
              if not token:
                  return "no token", None
              data = json.dumps({"query": query, "variables": variables}).encode()
              status, body = get("https://api.github.com/graphql", token, "application/json", data)
              try:
                  answer = json.loads(body)
              except ValueError:
                  return f"status {status}, no JSON", None
              if answer.get("errors"):
                  return "errors: " + ", ".join(sorted({str(e.get("type", "error")) for e in answer["errors"]})), None
              d = answer.get("data") or {}
              node = d.get("node") if "node" in d else (d.get("repository") or {}).get("issue")
              return (f"status {status}", node) if isinstance(node, dict) else (f"status {status}, node null", None)


          def save(name, content):
              if SAVE and isinstance(content, str):
                  with open(os.path.join(SAVE, name), "w", encoding="utf-8") as f:
                      f.write(content)


          def main():
              public_ids = set()
              for number in TARGETS + [CONTROL]:
                  status, data = rest(number, None)
                  if not data and TOKEN:
                      time.sleep(1)
                      status, data = rest(number, TOKEN)
                  if data:
                      public_ids.add(str(data["id"]))
                  time.sleep(1)

              many = {}
              if os.environ.get("MORE") == "1":
                  ids = []
                  for number in TARGETS:
                      st, d = rest(number, TOKEN)
                      if d:
                          ids.append(d["node_id"])
                      time.sleep(1)
                  many["graphql_nodes"] = graphql_many(Q_NODES, {"ids": ids}, TOKEN)
                  time.sleep(1)
                  many["graphql_issues_list"] = graphql_many(Q_LIST, {}, TOKEN)
                  time.sleep(1)
                  many["graphql_search"] = graphql_many(Q_SEARCH, {}, TOKEN)
                  time.sleep(1)
              for number in TARGETS:
                  anon_status, anon = rest(number, None)
                  time.sleep(1)
                  tok_status, tok = rest(number, TOKEN) if TOKEN else ("no token", None)
                  time.sleep(1)
                  source = (anon or tok or {}).get("body") or ""
                  m = re.search(r"Dennis-Otto/rendering-measurements-private#\d+|https://github\.com/Dennis-Otto/rendering-measurements-private/issues/\d+", source)
                  ref = m.group(0) if m else ""
                  node_id = (anon or tok or {}).get("node_id")
                  g1_status, g1 = graphql(Q_NODE, {"id": node_id}, TOKEN)
                  time.sleep(1)
                  g2_status, g2 = graphql(Q_REPO, {"o": "Dennis-Otto", "n": "rendering-measurements", "i": number}, TOKEN)
                  time.sleep(1)
                  readings = {
                      "rest_without_token": (anon_status, (anon or {}).get("body_html"), (anon or {}).get("body_text")),
                      "rest_token": (tok_status, (tok or {}).get("body_html"), (tok or {}).get("body_text")),
                      "graphql_node": (g1_status, (g1 or {}).get("bodyHTML"), (g1 or {}).get("bodyText")),
                      "graphql_repository_issue": (g2_status, (g2 or {}).get("bodyHTML"), (g2 or {}).get("bodyText")),
                  }
                  for name, (status, found) in many.items():
                      node = found.get(number)
                      readings[name] = (status if node else status + ", issue missing", (node or {}).get("bodyHTML"), (node or {}).get("bodyText"))
                  line = {"label": LABEL, "issue": number, "source_hash": salted(source), "source_has_ref": bool(ref)}
                  for name, (status, html, text) in readings.items():
                      save(f"{LABEL}.{number}.{name}.html", html)
                      save(f"{LABEL}.{number}.{name}.txt", text)
                      line[name] = {"status": status, "html": html_facts(html, ref, public_ids), "text": text_facts(text, ref)}
                  print(json.dumps(line), flush=True)


          if __name__ == "__main__":
              main()
              sys.exit(0)
